name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Server ────────────────────────────────────────────────────────────────
  server:
    name: Server — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffm_user
          POSTGRES_PASSWORD: ffm_pass
          POSTGRES_DB: family_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ffm_user:ffm_pass@localhost:5432/family_finance
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit

      - name: Run migrations
        run: npx prisma migrate deploy

  # ─── Client ────────────────────────────────────────────────────────────────
  client:
    name: Client — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
